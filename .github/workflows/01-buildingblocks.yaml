name: Test Terraform

on: [push]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 1.0.11

    - name: Configure AWS credentialss
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Initialize Terraformm
      run: terraform init
      working-directory: ./TerraformScripts

    - name: Plan Terraform
      run: terraform plan
      working-directory: ./TerraformScripts

    - name: Apply Terraform
      run: terraform apply --auto-approve
      working-directory: ./TerraformScripts

 



    - name: Get Terraform output
      id: get_output
      run: |
        terraform output -json > tf_output.json
      working-directory: ./TerraformScripts

    - name: Set EC2 public IP as environment variable
      id: set_ec2_ip
      run: |
        EC2_PUBLIC_IP=$(jq -r .web_server_public_ip.value < ./TerraformScripts/tf_output.json)
        echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> $GITHUB_ENV

    - name: Wait for 2 minutes
      run: sleep 120
  


    - name: Destroy Terraform
      run: terraform destroy --auto-approve
      working-directory: ./TerraformScripts
